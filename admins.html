<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Admins - Shop Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --primary: #1B2A4A;
            --primary-light: #2C3E6B;
            --primary-dark: #0D1A2D;
            --secondary: #4A90D9;
            --accent: #F5A623;
            --accent-hover: #D48E1A;
            --success: #27AE60;
            --danger: #E74C3C;
            --danger-hover: #C0392B;
            --bg: #F0F4F8;
            --card: #FFFFFF;
            --text: #2C3E50;
            --text-light: #7F8C8D;
            --border: #E1E8ED;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --radius-sm: 6px;
            --transition: 0.25s ease;
            --sidebar-width: 240px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --input-bg: #fff;
            --card-hover: rgba(74, 144, 217, 0.04);
            --modal-bg: rgba(0, 0, 0, 0.5);
            --toast-bg: var(--primary);
            --toast-text: #fff;
            --border-light: rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] {
            --bg: #121826;
            --card: #1E2638;
            --text: #E8EDF5;
            --text-light: #9AA8C7;
            --border: #2D3748;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --input-bg: #252F44;
            --card-hover: rgba(74, 144, 217, 0.08);
            --modal-bg: rgba(0, 0, 0, 0.7);
            --toast-bg: #2C3E6B;
            --toast-text: #fff;
            --border-light: rgba(255, 255, 255, 0.06);
            --primary: #5A7FC0;
            --primary-light: #6F92D0;
            --primary-dark: #3A5A8A;
        }

        [data-theme="dark"] .sidebar {
            background: #0E1525;
        }
        [data-theme="dark"] .sidebar-brand {
            border-bottom-color: rgba(255, 255, 255, 0.06);
        }
        [data-theme="dark"] .sidebar-footer {
            border-top-color: rgba(255, 255, 255, 0.06);
        }
        [data-theme="dark"] .topbar {
            background: var(--card);
            border-bottom-color: var(--border);
        }
        [data-theme="dark"] input,
        [data-theme="dark"] select {
            background: var(--input-bg);
            color: var(--text);
            border-color: var(--border);
        }
        [data-theme="dark"] input:focus,
        [data-theme="dark"] select:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.25);
        }
        [data-theme="dark"] .card {
            border-color: var(--border);
        }
        [data-theme="dark"] .admin-card {
            background: var(--card);
            border-color: var(--border);
        }
        [data-theme="dark"] .admin-card:hover {
            border-color: var(--secondary);
        }
        [data-theme="dark"] .sidebar-toggle {
            background: var(--primary);
            color: #fff;
        }
        [data-theme="dark"] .sidebar-toggle:hover {
            background: var(--primary-light);
        }
        [data-theme="dark"] .toast-msg {
            background: var(--toast-bg);
            color: var(--toast-text);
        }
        [data-theme="dark"] .card-header h3 {
            color: var(--text);
        }
        [data-theme="dark"] .card-header h3 i {
            color: var(--accent);
        }
        [data-theme="dark"] .page-title h2 {
            color: var(--text);
        }
        [data-theme="dark"] .page-title h2 i {
            color: var(--accent);
        }
        [data-theme="dark"] .welcome-text {
            color: var(--text);
        }
        [data-theme="dark"] .welcome-text span {
            color: var(--secondary);
        }
        [data-theme="dark"] .topbar .topbar-actions .lang-toggle {
            background: var(--bg);
            border-color: var(--border);
        }
        [data-theme="dark"] .topbar .topbar-actions .lang-toggle button {
            color: var(--text-light);
        }
        [data-theme="dark"] .topbar .topbar-actions .lang-toggle button.active {
            background: var(--primary);
            color: #fff;
        }
        [data-theme="dark"] .topbar .topbar-actions .lang-toggle button:hover:not(.active) {
            color: var(--text);
        }
        [data-theme="dark"] .sidebar-nav a {
            color: rgba(255, 255, 255, 0.6);
        }
        [data-theme="dark"] .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        [data-theme="dark"] .sidebar-nav a.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        [data-theme="dark"] .empty-state {
            color: var(--text-light);
        }
        [data-theme="dark"] .empty-state h4 {
            color: var(--text);
        }
        [data-theme="dark"] .text-muted {
            color: var(--text-light);
        }
        [data-theme="dark"] .perm-group .perm-option input[type="radio"] {
            accent-color: var(--secondary);
        }
        [data-theme="dark"] .perm-checkboxes label input[type="checkbox"] {
            accent-color: var(--secondary);
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            transition: background 0.3s, color 0.3s;
        }
        a {
            color: var(--secondary);
            text-decoration: none;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
            border: none;
            background: none;
            outline: none;
        }
        input,
        select {
            font-family: inherit;
            font-size: inherit;
            outline: none;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            background: var(--input-bg);
            width: 100%;
            transition: var(--transition);
            color: var(--text);
        }
        input:focus,
        select:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.2);
        }
        input::placeholder {
            color: var(--text-light);
            opacity: 0.7;
        }
        select {
            appearance: auto;
            cursor: pointer;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--primary);
            color: #fff;
            height: 100vh;
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
            z-index: 100;
            transition: background 0.3s;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
        }
        .sidebar-brand {
            padding: 20px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .sidebar-brand i {
            font-size: 26px;
            color: var(--accent);
        }
        .sidebar-brand span {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .sidebar-brand small {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.7;
            display: block;
            margin-top: -2px;
        }
        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 11px 16px;
            border-radius: var(--radius-sm);
            color: rgba(255, 255, 255, 0.7);
            transition: var(--transition);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        .sidebar-nav a i {
            width: 20px;
            font-size: 16px;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .sidebar-nav a.active {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .sidebar-nav a.active i {
            color: var(--accent);
        }
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }
        .sidebar-footer .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.8);
        }
        .sidebar-footer .user-card .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: var(--primary);
            flex-shrink: 0;
            overflow: hidden;
        }
        .sidebar-footer .user-card .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sidebar-footer .user-card .user-info {
            flex: 1;
            min-width: 0;
        }
        .sidebar-footer .user-card .user-info .name {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-footer .user-card .user-info .role {
            font-size: 11px;
            opacity: 0.6;
        }
        .sidebar-footer .logout-btn {
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            background: none;
            border: none;
            cursor: pointer;
        }
        .sidebar-footer .logout-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== SIDEBAR TOGGLE ===== */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 200;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: var(--transition);
        }
        .sidebar-toggle:hover {
            background: var(--primary-light);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 99;
            backdrop-filter: blur(2px);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .topbar {
            background: var(--card);
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: background 0.3s, border-color 0.3s;
        }
        .topbar .page-title h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            transition: color 0.3s;
        }
        .topbar .page-title h2 i {
            color: var(--accent);
            margin-right: 8px;
        }
        .topbar .topbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .topbar .topbar-actions .lang-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg);
            padding: 4px 6px;
            border-radius: 30px;
            border: 1px solid var(--border);
            transition: background 0.3s, border-color 0.3s;
        }
        .topbar .topbar-actions .lang-toggle button {
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
            transition: var(--transition);
            border: none;
            background: none;
            color: var(--text-light);
            cursor: pointer;
        }
        .topbar .topbar-actions .lang-toggle button.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(27, 42, 74, 0.2);
        }
        .topbar .topbar-actions .lang-toggle button:hover:not(.active) {
            color: var(--primary);
        }
        .topbar .topbar-actions .theme-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            font-size: 13px;
            color: var(--text-light);
            font-weight: 600;
        }
        .topbar .topbar-actions .theme-toggle:hover {
            border-color: var(--secondary);
        }
        .topbar .topbar-actions .theme-toggle i {
            font-size: 16px;
            transition: color 0.3s;
        }
        .topbar .topbar-actions .welcome-text {
            font-weight: 500;
            color: var(--text);
            font-size: 14px;
            transition: color 0.3s;
        }
        .topbar .topbar-actions .welcome-text span {
            color: var(--primary);
            font-weight: 700;
            transition: color 0.3s;
        }

        .content-area {
            flex: 1;
            padding: 24px 28px 40px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid var(--border-light);
            transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .card-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary);
            transition: color 0.3s;
        }
        .card-header h3 i {
            color: var(--accent);
            margin-right: 8px;
        }
        .card-header .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 13px;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(27, 42, 74, 0.2);
        }
        .btn-secondary {
            background: var(--secondary);
            color: #fff;
        }
        .btn-secondary:hover {
            background: #3A7BC8;
            transform: translateY(-1px);
        }
        .btn-accent {
            background: var(--accent);
            color: var(--primary);
        }
        .btn-accent:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: var(--danger-hover);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1.5px solid var(--border);
        }
        .btn-outline:hover {
            background: var(--bg);
            border-color: var(--primary);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }
        .btn-xs {
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 4px;
        }

        /* ===== FORMS ===== */
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .form-row .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-row .form-group label {
            font-weight: 600;
            font-size: 13px;
            color: var(--primary);
            transition: color 0.3s;
        }
        .form-row .form-group label .optional {
            font-weight: 400;
            color: var(--text-light);
            font-size: 11px;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        /* ===== ADMIN CARDS ===== */
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .admin-grid .admin-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 18px 20px;
            transition: var(--transition);
        }
        .admin-grid .admin-card:hover {
            box-shadow: var(--shadow);
            border-color: var(--secondary);
        }
        .admin-grid .admin-card .admin-name {
            font-weight: 700;
            font-size: 16px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }
        .admin-grid .admin-card .admin-name .role-tag {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            background: var(--accent);
            color: var(--primary);
        }
        .admin-grid .admin-card .admin-name .role-tag.head {
            background: #2C3E6B;
            color: #fff;
        }
        .admin-grid .admin-card .admin-details {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition: color 0.3s;
        }
        .admin-grid .admin-card .admin-details i {
            width: 18px;
            color: var(--secondary);
        }
        .admin-grid .admin-card .admin-actions {
            margin-top: 12px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* ===== SEARCH ===== */
        .search-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            min-width: 160px;
            padding: 8px 14px;
        }

        /* ===== PERMISSIONS ===== */
        .perm-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 12px 0;
        }
        .perm-group .perm-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .perm-group .perm-option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }
        .perm-checkboxes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 6px 12px;
            padding: 8px 0;
        }
        .perm-checkboxes label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .perm-checkboxes label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        .empty-state i {
            font-size: 48px;
            opacity: 0.3;
            margin-bottom: 12px;
        }
        .empty-state h4 {
            font-size: 18px;
            color: var(--text);
            margin-bottom: 4px;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--modal-bg);
            z-index: 300;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: var(--card);
            border-radius: var(--radius);
            max-width: 620px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px 36px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-box .modal-header h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }
        .modal-box .modal-header .close-btn {
            font-size: 24px;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            background: none;
            border: none;
            padding: 4px 8px;
        }
        .modal-box .modal-header .close-btn:hover {
            color: var(--danger);
            transform: rotate(90deg);
        }
        .modal-box .modal-body {
            padding: 4px 0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                transform: translateX(-100%);
                height: 100vh;
                width: 280px;
                z-index: 150;
                box-shadow: 4px 0 30px rgba(0, 0, 0, 0.2);

  const firebaseConfig = {

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        //  CHECK LOGIN
        // ============================================================
        if (localStorage.getItem('sms_logged_in') !== 'true') {
            window.location.href = 'index.html';
        }

        const adminRole = localStorage.getItem('sms_admin_role') || 'head';
        if (adminRole !== 'head') {
            alert('Only the Head Admin can access this page.');
            window.location.href = 'dashboard.html';
        }

        // ============================================================
        //  HELPERS
        // ============================================================
        function generateId() {
            return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit',
                minute: '2-digit' });
        }

        function hasPermission(permission) {
            const role = localStorage.getItem('sms_admin_role') || 'head';
            if (role === 'head') return true;
            const perms = JSON.parse(localStorage.getItem('sms_admin_permissions') || '{"all":true,"functions":[]}');
            if (perms.all) return true;
            return perms.functions && perms.functions.includes(permission);
        }

        // ============================================================
        //  FIREBASE DATA HELPERS
        // ============================================================
        async function getData() {
            try {
                const uid = localStorage.getItem('sms_firebase_uid') || 'anonymous';
                const docRef = db.collection('users').doc(uid).collection('data').doc('appData');
                const doc = await docRef.get();
                if (doc.exists) {
                    return doc.data();
                }
                return { items: [], companies: [], activities: [], admins: [] };
            } catch (error) {
                console.error('Error getting data:', error);
                return { items: [], companies: [], activities: [], admins: [] };
            }
        }

        async function saveData(data) {
            try {
                const uid = localStorage.getItem('sms_firebase_uid') || 'anonymous';
                const docRef = db.collection('users').doc(uid).collection('data').doc('appData');
                await docRef.set(data, { merge: true });
                return true;
            } catch (error) {
                console.error('Error saving data:', error);
                return false;
            }
        }

        async function addActivity(data, action, details) {
            const adminName = localStorage.getItem('sms_admin_name') || 'Head';
            const adminId = localStorage.getItem('sms_admin_id') || 'admin_head';
            if (!data.activities) data.activities = [];
            data.activities.unshift({
                id: generateId(),
                action: action,
                adminId: adminId,
                adminName: adminName,
                details: details,
                timestamp: new Date().toISOString()
            });
            if (data.activities.length > 500) data.activities = data.activities.slice(0, 500);
            await saveData(data);
        }

        // ============================================================
        //  RENDER ADMINS
        // ============================================================
        async function renderAdmins() {
            const container = document.getElementById('adminsListContainer');
            const search = document.getElementById('adminSearch').value.toLowerCase().trim();

            try {
                const data = await getData();
                let admins = [...(data.admins || [])];

                // Ensure head admin exists
                const hasHead = admins.some(a => a.role === 'head');
                if (!hasHead) {
                    const headAdmin = {
                        id: 'admin_head',
                        name: 'Head',
                        username: 'sms.user',
                        password: '12341122',
                        email: '',
                        role: 'head',
                        permissions: { all: true, functions: [] },
                        createdAt: new Date().toISOString()
                    };
                    admins.unshift(headAdmin);
                    data.admins = admins;
                    await saveData(data);
                }

                if (search) {
                    admins = admins.filter(a => a.name.toLowerCase().includes(search) ||
                        a.username.toLowerCase().includes(search));
                }

                if (admins.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-users"></i>
                            <h4>${t('no_admins')}</h4>

                    `;
                    return;
                }

                let html = '<div class="admin-grid">';
                admins.forEach(a => {
                    const isHeadAdmin = a.role === 'head';
                    const roleLabel = isHeadAdmin ? t('role_head') : t('role_sub');
                    const canDelete = !isHeadAdmin;
                    html += `

                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

                container.querySelectorAll('.edit-admin-btn').forEach(btn => {
                    btn.addEventListener('click', () => editAdmin(btn.dataset.id));
                });
                container.querySelectorAll('.delete-admin-btn').forEach(btn => {
                    btn.addEventListener('click', () => deleteAdmin(btn.dataset.id));
                });
                container.querySelectorAll('.view-creds-btn').forEach(btn => {
                    btn.addEventListener('click', () => viewAdminCredentials(btn.dataset.id));
                });

            } catch (error) {
                console.error('Error rendering admins:', error);

                        <p>Please check your connection.</p>

        // ============================================================
        //  ADMIN CRUD
        // ============================================================
        document.getElementById('adminForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = await getData();
            const id = document.getElementById('adminEditId').value;
            const name = document.getElementById('adminName').value.trim();
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value;
            const confirm = document.getElementById('adminConfirmPassword').value;
            const email = document.getElementById('adminEmail').value.trim();
            const permType = document.querySelector('input[name="permType"]:checked').value;
            const checkboxes = document.querySelectorAll('#specificPerms input[type="checkbox"]:checked');
            const functions = Array.from(checkboxes).map(cb => cb.value);

            if (!name) { alert('Name is required.'); return; }
            if (!username) { alert('Username is required.'); return; }
            if (!id && !password) { alert('Password is required for new admin.'); return; }
            if (password && password !== confirm) { alert('Passwords do not match.'); return; }
            if (password && password.length < 4) { alert('Password must be at least 4 characters.'); return; }

            // Check duplicate username
            const duplicate = (data.admins || []).find(a => a.username === username && a.id !== id);
            if (duplicate) {
                alert('Username already exists. Please choose another.');
                return;
            }

            if (!data.admins) data.admins = [];

            if (id) {
                const existing = data.admins.find(a => a.id === id);
                if (!existing) { alert('Admin not found.'); return; }
                if (existing.role === 'head') {
                    alert('Cannot edit the Head Admin.');
                    return;
                }
                existing.name = name;
                existing.username = username;
                if (password) existing.password = password;
                existing.email = email;
                existing.permissions = {
                    all: (permType === 'all'),
                    functions: (permType === 'all') ? [] : functions

            } else {
                const newAdmin = {
                    id: generateId(),
                    name,
                    username,
                    password,
                    email,
                    role: 'sub',
                    permissions: {
                        all: (permType === 'all'),
                        functions: (permType === 'all') ? [] : functions
                    },
                    createdAt: new Date().toISOString()
                };
                data.admins.push(newAdmin);
                await addActivity(data, 'add_admin', `added admin: ${name}`);
                await saveData(data);
                resetAdminForm();
                await renderAdmins();
                showToast('Admin added successfully!');
            }
        });

        function editAdmin(id) {
            getData().then(data => {
                const admin = (data.admins || []).find(a => a.id === id);
                if (!admin) return;
                if (admin.role === 'head') { alert('Cannot edit the Head Admin.'); return; }

                document.getElementById('adminEditId').value = id;
                document.getElementById('adminName').value = admin.name;
                document.getElementById('adminUsername').value = admin.username;
                document.getElementById('adminPassword').value = '';
                document.getElementById('adminConfirmPassword').value = '';
                document.getElementById('adminEmail').value = admin.email || '';
                if (admin.permissions && admin.permissions.all) {
                    document.querySelector('input[name="permType"][value="all"]').checked = true;
                } else {
                    document.querySelector('input[name="permType"][value="specific"]').checked = true;
                }
                const allPerms = ['add_item', 'edit_item', 'delete_item', 'add_company', 'edit_company', 'delete_company',
                    'view_admins'
                ];
                allPerms.forEach(p => {
                    const cb = document.querySelector(`#specificPerms input[value="${p}"]`);
                    if (cb) {
                        cb.checked = admin.permissions && admin.permissions.all ? true :
                            (admin.permissions && admin.permissions.functions && admin.permissions.functions
                            .includes(p));
                    }
                });
                toggleSpecificPerms();
                document.getElementById('adminSubmitBtn').innerHTML = `<i class="fas fa-sync-alt"></i> ${t('update')}`;
                document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });
            });
        }

        async function deleteAdmin(id) {
            const data = await getData();
            const admin = (data.admins || []).find(a => a.id === id);
            if (!admin) return;
            if (admin.role === 'head') { alert('Cannot delete the Head Admin.'); return; }
            if (!confirm(t('confirm_delete_admin') + `\n"${admin.name}"`)) return;
            data.admins = data.admins.filter(a => a.id !== id);
            await addActivity(data, 'delete_admin', `deleted admin: ${admin.name}`);
            await saveData(data);
            await renderAdmins();
            showToast('Admin deleted successfully!');
        }

        function viewAdminCredentials(id) {
            getData().then(data => {
                const admin = (data.admins || []).find(a => a.id === id);
                if (!admin) return;
                if (admin.role === 'head') { alert('This is the Head Admin.'); return; }

                const html = `
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                        <div><strong>${t('admin_name')}</strong><br>${escapeHtml(admin.name)}</div>
                        <div><strong>${t('admin_username')}</strong><br>${escapeHtml(admin.username)}</div>
                        <div><strong>${t('admin_password')}</strong><br><code>${escapeHtml(admin.password)}</code></div>
                        <div><strong>${t('admin_email')}</strong><br>${escapeHtml(admin.email) || '—'}</div>
                        <div><strong>${t('permissions')}</strong><br>${admin.permissions && admin.permissions.all ? t('all_permissions') : (admin.permissions && admin.permissions.functions ? admin.permissions.functions.join(', ') : '—')}</div>
                        <div><strong>${t('created_at')}</strong><br>${formatDate(admin.createdAt)}</div>
                    </div>
                `;
                openModal(t('view_credentials'), html);
            });
        }

        function resetAdminForm() {
            document.getElementById('adminEditId').value = '';
            document.getElementById('adminName').value = '';
            document.getElementById('adminUsername').value = '';
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminConfirmPassword').value = '';
            document.getElementById('adminEmail').value = '';
            document.querySelector('input[name="permType"][value="all"]').checked = true;
            document.querySelectorAll('#specificPerms input[type="checkbox"]').forEach(cb => cb.checked = true);
            toggleSpecificPerms();
            document.getElementById('adminSubmitBtn').innerHTML = `<i class="fas fa-save"></i> ${t('save_admin')}`;
        }

        function toggleSpecificPerms() {
            const specific = document.querySelector('input[name="permType"][value="specific"]').checked;
            document.getElementById('specificPerms').style.display = specific ? 'grid' : 'none';
        }

        document.querySelectorAll('input[name="permType"]').forEach(el => {
            el.addEventListener('change', toggleSpecificPerms);
        });
        document.getElementById('adminCancelBtn').addEventListener('click', resetAdminForm);
        document.getElementById('adminSearch').addEventListener('input', renderAdmins);

        // ============================================================
        //  THEME
        // ============================================================
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeIcon').className = 'fas fa-sun';
                document.getElementById('themeLabel').textContent = t('light_mode') || 'Light';
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('themeIcon').className = 'fas fa-moon';
                document.getElementById('themeLabel').textContent = t('dark_mode') || 'Dark';
            }
            localStorage.setItem('sms_theme', theme);
        }

        function toggleTheme() {
            const current = localStorage.getItem('sms_theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // ============================================================
        //  LANGUAGE
        // ============================================================
        function setLanguage(lang) {
            currentLang = lang;
            document.body.classList.toggle('lang-urdu', lang === 'ur');
            document.querySelectorAll('.lang-toggle button').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === lang);
            });
            applyLanguage();
        }

        function applyLanguage() {
            const keys = ['nav_dashboard', 'nav_items', 'nav_company', 'nav_admins', 'nav_profile', 'nav_activity'];
            keys.forEach(k => {
                const el = document.querySelector(`[data-key="${k}"]`);
                if (el) el.textContent = t(k);
            });
            document.querySelector('[data-key="title_admins"]').textContent = t('title_admins');
            document.querySelector('[data-key="add_admin"]').textContent = t('add_admin');
            document.querySelector('[data-key="admin_name"]').textContent = t('admin_name');
            document.querySelector('[data-key="admin_username"]').textContent = t('admin_username');
            document.querySelector('[data-key="admin_password"]').textContent = t('admin_password');
            document.querySelector('[data-key="admin_confirm"]').textContent = t('admin_confirm');
            document.querySelector('[data-key="admin_email"]').textContent = t('admin_email');
            document.querySelector('[data-key="permissions"]').textContent = t('permissions');
            document.querySelector('[data-key="all_permissions"]').textContent = t('all_permissions');
            document.querySelector('[data-key="specific_permissions"]').textContent = t('specific_permissions');
            document.querySelector('[data-key="perm_add_item"]').textContent = t('perm_add_item');
            document.querySelector('[data-key="perm_edit_item"]').textContent = t('perm_edit_item');
            document.querySelector('[data-key="perm_delete_item"]').textContent = t('perm_delete_item');
            document.querySelector('[data-key="perm_add_company"]').textContent = t('perm_add_company');
            document.querySelector('[data-key="perm_edit_company"]').textContent = t('perm_edit_company');
            document.querySelector('[data-key="perm_delete_company"]').textContent = t('perm_delete_company');
            document.querySelector('[data-key="perm_view_admins"]').textContent = t('perm_view_admins');
            document.querySelector('[data-key="save_admin"]').textContent = t('save_admin');
            document.querySelector('[data-key="cancel"]').textContent = t('cancel');
            document.querySelector('[data-key="all_admins"]').textContent = t('all_admins');

            const theme = localStorage.getItem('sms_theme') || 'light';
            if (theme === 'dark') {
                document.getElementById('themeLabel').textContent = t('light_mode') || 'Light';
            } else {
                document.getElementById('themeLabel').textContent = t('dark_mode') || 'Dark';
            }

            renderAdmins();
        }

        document.querySelectorAll('.lang-toggle button').forEach(btn => {
            btn.addEventListener('click', function() {
                setLanguage(this.dataset.lang);
            });
        });

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(msg) {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = 'toast-msg';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transition = 'opacity 0.4s';
                setTimeout(() => div.remove(), 400);
            }, 3000);
        }

        // ============================================================
        //  SIDEBAR
        // ============================================================
        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        document.getElementById('sidebarToggle').addEventListener('click', openSidebar);
        document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

        window.addEventListener('resize', function() {
            if (window.innerWidth > 992) closeSidebar();
        });

        // ============================================================
        //  MODAL
        // ============================================================
        function openModal(title, bodyHtml) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHtml;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============================================================
        //  LOGOUT
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            try {
                await auth.signOut();
            } catch (e) {
                console.warn('Sign out error:', e);
            }
            localStorage.removeItem('sms_logged_in');
            localStorage.removeItem('sms_admin_name');
            localStorage.removeItem('sms_admin_role');
            localStorage.removeItem('sms_admin_id');
            localStorage.removeItem('sms_admin_permissions');
            localStorage.removeItem('sms_firebase_uid');
            window.location.href = 'index.html';
        });

        // ============================================================
        //  INIT
        // ============================================================
        const savedTheme = localStorage.getItem('sms_theme') || 'light';
        applyTheme(savedTheme);

        const adminName = localStorage.getItem('sms_admin_name') || 'Head';
        document.getElementById('sidebarAvatar').textContent = adminName.charAt(0).toUpperCase();
        document.getElementById('sidebarName').textContent = adminName;
        document.getElementById('sidebarRole').textContent = 'Head Admin';
        document.getElementById('welcomeName').textContent = adminName;

        toggleSpecificPerms();

        // Ensure head admin exists in Firestore
        (async function initAdmins() {
            const data = await getData();
            const hasHead = (data.admins || []).some(a => a.role === 'head');
            if (!hasHead) {
                if (!data.admins) data.admins = [];
                data.admins.push({
                    id: 'admin_head',
                    name: 'Head',
                    username: 'sms.user',
                    password: '12341122',
                    email: '',
                    role: 'head',
                    permissions: { all: true, functions: [] },
                    createdAt: new Date().toISOString()
                });
                await saveData(data);
            }
            await renderAdmins();
        })();

        console.log('👥 Admins page loaded with Firebase integration.');
        console.log('👤 Logged in as:', adminName);
        console.log('📌 Make sure to replace firebaseConfig with your own credentials.');
    </script>

</body>
</html>
