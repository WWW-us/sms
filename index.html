<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Login - Shop Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #1B2A4A;
            --primary-light: #2C3E6B;
            --primary-dark: #0D1A2D;
            --secondary: #4A90D9;
            --accent: #F5A623;
            --danger: #E74C3C;
            --success: #27AE60;
            --text-light: #7F8C8D;
            --radius: 12px;
            --radius-sm: 6px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, var(--primary-dark) 0%, var(--primary) 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: rgba(74, 144, 217, 0.07);
            top: -200px;
            right: -200px;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(245, 166, 35, 0.05);
            bottom: -150px;
            left: -150px;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .login-box .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-box .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .login-box .logo h1 i {
            color: var(--accent);
            margin-right: 8px;
        }
        .login-box .logo p {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 4px;
        }
        .login-box .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        .login-box .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: var(--primary);
            margin-bottom: 5px;
        }
        .login-box .form-group .input-wrap {
            position: relative;
        }
        .login-box .form-group .input-wrap input {
            width: 100%;
            padding: 10px 44px 10px 14px;
            border: 1.5px solid #E1E8ED;
            border-radius: var(--radius-sm);
            font-size: 15px;
            outline: none;
            transition: 0.25s ease;
            font-family: inherit;
            background: #fff;
        }
        .login-box .form-group .input-wrap input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.2);
        }
        .login-box .form-group .toggle-pass {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 18px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }
        .login-box .form-group .toggle-pass:hover {
            color: var(--primary);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 16px;
            transition: 0.25s ease;
            margin-top: 8px;
            cursor: pointer;
            font-family: inherit;
        }
        .login-btn:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(27, 42, 74, 0.25);
        }
        .login-error {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
            font-weight: 500;
        }
        .login-success {
            color: var(--success);
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
            font-weight: 500;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        .loading-spinner.active {
            display: block;
        }
        .loading-spinner i {
            font-size: 24px;
            color: var(--secondary);
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 480px) {
            .login-box {
                padding: 32px 24px;
            }
            .login-box .logo h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo">
            <h1><i class="fas fa-store-alt"></i> SMS</h1>
            <p>Shop Management System</p>
        </div>
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="loginUsername">Username</label>
                <div class="input-wrap">
                    <input type="text" id="loginUsername" placeholder="Enter username" />
                </div>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrap">
                    <input type="password" id="loginPassword" placeholder="Enter password" />
                    <button type="button" class="toggle-pass" id="loginTogglePass" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</button>
            <div class="loading-spinner" id="loginSpinner"><i class="fas fa-spinner"></i> Logging in...</div>
            <div class="login-error" id="loginError"></div>
            <div class="login-success" id="loginSuccess"></div>
        </form>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>

    <script>
        // ============================================================
        //  FIREBASE CONFIG - REPLACE WITH YOUR OWN
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB0RN2WGrPNLOxFMzOEjEITwAejZrzhWvE",
            authDomain: "shop-m-system.firebaseapp.com",
            projectId: "shop-m-system",
            storageBucket: "shop-m-system.firebasestorage.app",
            messagingSenderId: "1037445605212",
            appId: "1:1037445605212:web:b0420a71036fb525f30399",
            measurementId: "G-X0203129L3"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        //  DOM REFS
        // ============================================================
        const loginForm = document.getElementById('loginForm');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');
        const loginSuccess = document.getElementById('loginSuccess');
        const loginTogglePass = document.getElementById('loginTogglePass');
        const loginSpinner = document.getElementById('loginSpinner');

        // Toggle password visibility
        loginTogglePass.addEventListener('click', function() {
            const input = loginPassword;
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });

        // ============================================================
        //  LOGIN FUNCTION - PURE FIREBASE (NO localStorage)
        // ============================================================
        async function login(username, password) {
            loginSpinner.classList.add('active');
            loginError.textContent = '';
            loginSuccess.textContent = '';

            try {
                // Step 1: Sign in anonymously
                let user = auth.currentUser;
                if (!user) {
                    try {
                        await auth.signInAnonymously();
                        user = auth.currentUser;
                    } catch (authError) {
                        loginError.textContent = '❌ Please enable Anonymous Authentication in Firebase Console.';
                        loginSpinner.classList.remove('active');
                        return false;
                    }
                }

                // Step 2: Check if this is the head admin (sms.user / 11335577)
                if (username === 'sms.user' && password === '11335577') {
                    const headAdmin = {
                        id: 'admin_head',
                        name: 'Head Admin',
                        username: 'sms.user',
                        password: '11335577',
                        email: '',
                        role: 'head',
                        permissions: { all: true, functions: [] },
                        createdAt: new Date().toISOString()
                    };
                    
                    try {
                        const doc = await db.collection('admins').doc('admin_head').get();
                        if (!doc.exists) {
                            await db.collection('admins').doc('admin_head').set(headAdmin);
                            await db.collection('users').doc(user.uid).collection('data').doc('appData').set({
                                items: [],
                                companies: [],
                                activities: [],
                                admins: [headAdmin],
                                createdAt: new Date().toISOString()
                            });
                        }
                    } catch (e) {
                        console.warn('Firestore save failed:', e);
                    }

                    loginSpinner.classList.remove('active');
                    loginSuccess.textContent = '✅ Login successful! Redirecting...';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                    return true;
                }

                // Step 3: Check sub-admins from Firestore
                let foundAdmin = null;
                try {
                    const snapshot = await db.collection('admins').get();
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (data.username === username && data.password === password) {
                            foundAdmin = { ...data, id: doc.id };
                        }
                    });
                } catch (e) {
                    console.warn('Firestore check failed:', e);
                }

                if (foundAdmin) {
                    loginSpinner.classList.remove('active');
                    loginSuccess.textContent = '✅ Login successful! Redirecting...';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                    return true;
                }

                loginError.textContent = '❌ Invalid username or password.';
                loginSpinner.classList.remove('active');
                return false;

            } catch (error) {
                console.error('Login error:', error);
                loginError.textContent = 'Login error: ' + error.message;
                loginSpinner.classList.remove('active');
                return false;
            }
        }

        // ============================================================
        //  EVENT LISTENERS
        // ============================================================
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = loginUsername.value.trim();
            const password = loginPassword.value.trim();

            if (!username || !password) {
                loginError.textContent = 'Please enter username and password.';
                return;
            }

            login(username, password);
        });

        // ============================================================
        //  CHECK IF ALREADY LOGGED IN (Firebase Auth only - NO localStorage)
        // ============================================================
        auth.onAuthStateChanged(async function(user) {
            if (user) {
                // Check if user has admin access
                try {
                    const snapshot = await db.collection('admins').get();
                    let isAdmin = false;
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (data.username === 'sms.user' || data.email === user.email) {
                            isAdmin = true;
                        }
                    });
                    if (isAdmin) {
                        window.location.href = 'dashboard.html';
                        return;
                    }
                } catch (e) {
                    console.warn('Error checking admin status:', e);
                }
            }
        });

        console.log('🔥 Firebase-Only Login page loaded.');
        console.log('👤 Head Admin: sms.user / 11335577');
        console.log('📌 NO localStorage used.');
    </script>

</body>
</html>
