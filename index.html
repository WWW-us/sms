<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Login - Shop Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #1B2A4A;
            --primary-light: #2C3E6B;
            --primary-dark: #0D1A2D;
            --secondary: #4A90D9;
            --accent: #F5A623;
            --danger: #E74C3C;
            --text-light: #7F8C8D;
            --radius: 12px;
            --radius-sm: 6px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, var(--primary-dark) 0%, var(--primary) 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: rgba(74, 144, 217, 0.07);
            top: -200px;
            right: -200px;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(245, 166, 35, 0.05);
            bottom: -150px;
            left: -150px;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .login-box .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-box .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .login-box .logo h1 i {
            color: var(--accent);
            margin-right: 8px;
        }
        .login-box .logo p {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 4px;
        }
        .login-box .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        .login-box .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: var(--primary);
            margin-bottom: 5px;
        }
        .login-box .form-group .input-wrap {
            position: relative;
        }
        .login-box .form-group .input-wrap input {
            width: 100%;
            padding: 10px 44px 10px 14px;
            border: 1.5px solid #E1E8ED;
            border-radius: var(--radius-sm);
            font-size: 15px;
            outline: none;
            transition: 0.25s ease;
            font-family: inherit;
        }
        .login-box .form-group .input-wrap input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.2);
        }
        .login-box .form-group .toggle-pass {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 18px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }
        .login-box .form-group .toggle-pass:hover {
            color: var(--primary);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 16px;
            transition: 0.25s ease;
            margin-top: 8px;
            cursor: pointer;
            font-family: inherit;
        }
        .login-btn:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(27, 42, 74, 0.25);
        }
        .login-error {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
            font-weight: 500;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        .loading-spinner.active {
            display: block;
        }
        .loading-spinner i {
            font-size: 24px;
            color: var(--secondary);
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 480px) {
            .login-box {
                padding: 32px 24px;
            }
            .login-box .logo h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo">
            <h1><i class="fas fa-store-alt"></i> SMS</h1>
            <p>Shop Management System</p>
        </div>
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="loginUsername">Username</label>
                <div class="input-wrap">
                    <input type="text" id="loginUsername" placeholder="Enter username" required />
                </div>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrap">
                    <input type="password" id="loginPassword" placeholder="Enter password" required />
                    <button type="button" class="toggle-pass" id="loginTogglePass" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</button>
            <div class="loading-spinner" id="loginSpinner"><i class="fas fa-spinner"></i> Logging in...</div>
            <div class="login-error" id="loginError"></div>
        </form>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>

    <script>
        // ============================================================
        //  FIREBASE CONFIG - REPLACE WITH YOUR OWN
        // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyB0RN2WGrPNLOxFMzOEjEITwAejZrzhWvE",
    authDomain: "shop-m-system.firebaseapp.com",
    databaseURL: "https://shop-m-system-default-rtdb.firebaseio.com",
    projectId: "shop-m-system",
    storageBucket: "shop-m-system.firebasestorage.app",
    messagingSenderId: "1037445605212",
    appId: "1:1037445605212:web:b0420a71036fb525f30399",
    measurementId: "G-X0203129L3"
  };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        //  DOM REFS
        // ============================================================
        const loginForm = document.getElementById('loginForm');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');
        const loginTogglePass = document.getElementById('loginTogglePass');
        const loginSpinner = document.getElementById('loginSpinner');

        // Toggle password visibility
        loginTogglePass.addEventListener('click', function() {
            const input = loginPassword;
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });

        // ============================================================
        //  LOGIN FUNCTION
        // ============================================================
        async function login(username, password) {
            loginSpinner.classList.add('active');
            loginError.textContent = '';

            try {
                // Try to sign in anonymously first
                let user = auth.currentUser;
                if (!user) {
                    await auth.signInAnonymously();
                    user = auth.currentUser;
                }

                // Query Firestore for admin with matching username and password
                const adminsRef = db.collection('admins');
                const snapshot = await adminsRef.where('username', '==', username).where('password', '==', password).get();

                if (snapshot.empty) {
                    loginError.textContent = 'Invalid username or password.';
                    loginSpinner.classList.remove('active');
                    return false;
                }

                // Get admin data
                let adminData = null;
                let adminId = null;
                snapshot.forEach(doc => {
                    adminData = doc.data();
                    adminId = doc.id;
                });

                // Store admin info in localStorage for session
                localStorage.setItem('sms_logged_in', 'true');
                localStorage.setItem('sms_admin_name', adminData.name);
                localStorage.setItem('sms_admin_role', adminData.role || 'sub');
                localStorage.setItem('sms_admin_id', adminId);
                if (adminData.permissions) {
                    localStorage.setItem('sms_admin_permissions', JSON.stringify(adminData.permissions));
                } else {
                    localStorage.setItem('sms_admin_permissions', JSON.stringify({ all: false, functions: [] }));
                }
                localStorage.setItem('sms_firebase_uid', user.uid);

                loginSpinner.classList.remove('active');
                window.location.href = 'dashboard.html';
                return true;

            } catch (error) {
                console.error('Login error:', error);
                loginError.textContent = 'Login error: ' + error.message;
                loginSpinner.classList.remove('active');
                return false;
            }
        }

        // ============================================================
        //  EVENT LISTENERS
        // ============================================================
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = loginUsername.value.trim();
            const password = loginPassword.value.trim();
            if (username && password) {
                login(username, password);
            } else {
                loginError.textContent = 'Please enter username and password.';
            }
        });

        // ============================================================
        //  CHECK IF ALREADY LOGGED IN
        // ============================================================
        auth.onAuthStateChanged(async function(user) {
            if (user && localStorage.getItem('sms_logged_in') === 'true') {
                // Verify admin still exists in Firestore
                const adminId = localStorage.getItem('sms_admin_id');
                if (adminId) {
                    try {
                        const doc = await db.collection('admins').doc(adminId).get();
                        if (doc.exists) {
                            window.location.href = 'dashboard.html';
                        } else {
                            // Admin deleted from Firestore, logout
                            localStorage.removeItem('sms_logged_in');
                            localStorage.removeItem('sms_admin_name');
                            localStorage.removeItem('sms_admin_role');
                            localStorage.removeItem('sms_admin_id');
                            localStorage.removeItem('sms_admin_permissions');
                            localStorage.removeItem('sms_firebase_uid');
                            await auth.signOut();
                        }
                    } catch (e) {
                        console.warn('Error verifying admin:', e);
                    }
                }
            }
        });

        console.log('🔐 Firebase Login page loaded.');
        console.log('👤 Default Head Admin: sms.user / 12341122');
        console.log('📌 Make sure to replace firebaseConfig with your own credentials.');
    </script>

</body>
</html>
