<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Shop Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #1e3a8a;
      --primary-hover: #1e40af;
      --secondary-color: #0f172a;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      --surface-color: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --error-color: #ef4444;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      background: var(--surface-color);
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-header i {
      font-size: 2.5rem;
      color: var(--primary-color);
      margin-bottom: 12px;
    }

    .brand-header h1 {
      font-size: 1.5rem;
      color: var(--text-main);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .brand-header p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 42px 12px 42px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .error-message {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--error-color);
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <i class="fa-solid fa-store"></i>
      <h1>Shop Management</h1>
      <p>Enter your credentials to access portal</p>
    </div>

    <div id="errorMessage" class="error-message">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="errorText">Invalid Username or Password</span>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="username">Username *</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-user input-icon"></i>
          <input type="text" id="username" placeholder="Enter username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password *</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="password" placeholder="Enter password" required>
          <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="loginBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Sign In</span>
      </button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB8nR7u2rdnL0Wc8fG4IRKet_a0tcsRdAY",
      authDomain: "laghari-shop.firebaseapp.com",
      databaseURL: "https://laghari-shop-default-rtdb.firebaseio.com",
      projectId: "laghari-shop",
      storageBucket: "laghari-shop.firebasestorage.app",
      messagingSenderId: "250908303863",
      appId: "1:250908303863:web:c601ba80ba9e5258eb4ef2"
    };

    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch(e) {
      console.warn("Firebase Init fallback active.");
    }

    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const loginBtn = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');

    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePasswordBtn.classList.toggle('fa-eye');
      togglePasswordBtn.classList.toggle('fa-eye-slash');
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      setLoading(true);
      hideError();

      // Instant Match Check for Main Admin Credentials
      if (username === 'sms.user' && password === '11335577.') {
        const defaultAdmin = {
          name: 'SMS Admin',
          username: 'sms.user',
          password: '11335577.',
          email: 'admin@sms.com',
          isMainAdmin: true,
          loginAccess: true,
          canLogin: true,
          isLoggedIn: true,
          permissions: { addItem: true, editItem: true, deleteItem: true, addCompany: true, manageAdmins: true }
        };

        const sessionPayload = {
          userId: 'main_admin',
          username: defaultAdmin.username,
          name: defaultAdmin.name,
          isMainAdmin: true,
          loggedInAt: new Date().toISOString()
        };

        // Save to LocalStorage for instant cross-tab verification
        localStorage.setItem('sms_user_session', JSON.stringify(sessionPayload));

        if (db) {
          try {
            await set(ref(db, 'active_session'), sessionPayload);
            await set(ref(db, 'admins/main_admin'), defaultAdmin);
          } catch (err) {
            console.warn("Firebase session write failed, continuing with local session:", err);
          }
        }

        window.location.replace('dashboard.html');
        return;
      }

      // Check Database Admins with Timeout
      if (db) {
        try {
          const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject('timeout'), 4000));
          const fetchPromise = get(child(ref(db), 'admins'));

          const snapshot = await Promise.race([fetchPromise, timeoutPromise]);
          let authenticatedUser = null;
          let adminKey = null;

          if (snapshot && snapshot.exists()) {
            const adminsData = snapshot.val();
            for (let key in adminsData) {
              if (adminsData[key].username === username && adminsData[key].password === password) {
                authenticatedUser = adminsData[key];
                adminKey = key;
                break;
              }
            }
          }

          if (authenticatedUser) {
            // 🚨 Strict Check: If loginAccess OR canLogin is explicitly set to false
            if (authenticatedUser.loginAccess === false || authenticatedUser.canLogin === false) {
              showError('Your login access has been revoked by Main Admin.');
              setLoading(false);
              return;
            }

            const sessionPayload = {
              userId: adminKey,
              username: authenticatedUser.username,
              name: authenticatedUser.name,
              isMainAdmin: !!authenticatedUser.isMainAdmin,
              authority: authenticatedUser.authority || 'specific',
              permissions: authenticatedUser.permissions || {},
              loggedInAt: new Date().toISOString()
            };

            localStorage.setItem('sms_user_session', JSON.stringify(sessionPayload));

            try {
              await set(ref(db, 'active_session'), sessionPayload);
              await set(ref(db, `admins/${adminKey}/isLoggedIn`), true);
            } catch (err) {
              console.warn("Firebase sync error:", err);
            }

            window.location.replace('dashboard.html');
            return;
          }
        } catch (err) {
          console.warn("DB check timed out or failed:", err);
        }
      }

      showError('Invalid username or password.');
      setLoading(false);
    });

    function showError(msg) {
      errorText.textContent = msg;
      errorMessage.style.display = 'flex';
    }

    function hideError() {
      errorMessage.style.display = 'none';
    }

    function setLoading(isLoading) {
      if (isLoading) {
        loginBtn.disabled = true;
        spinner.style.display = 'inline-block';
        btnText.textContent = 'Signing in...';
      } else {
        loginBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
