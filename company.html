<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Company - Shop Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== Same styles as items.html (abbreviated) ===== */
        :root {
            --primary: #1B2A4A;
            --primary-light: #2C3E6B;
            --primary-dark: #0D1A2D;
            --secondary: #4A90D9;
            --accent: #F5A623;
            --accent-hover: #D48E1A;
            --success: #27AE60;
            --danger: #E74C3C;
            --danger-hover: #C0392B;
            --bg: #F0F4F8;
            --card: #FFFFFF;
            --text: #2C3E50;
            --text-light: #7F8C8D;
            --border: #E1E8ED;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --radius-sm: 6px;
            --transition: 0.25s ease;
            --sidebar-width: 240px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --input-bg: #fff;
            --card-hover: rgba(74, 144, 217, 0.04);
            --modal-bg: rgba(0, 0, 0, 0.5);
            --toast-bg: var(--primary);
            --toast-text: #fff;
            --border-light: rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] {
            --bg: #121826;
            --card: #1E2638;
            --text: #E8EDF5;
            --text-light: #9AA8C7;
            --border: #2D3748;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --input-bg: #252F44;
            --card-hover: rgba(74, 144, 217, 0.08);
            --modal-bg: rgba(0, 0, 0, 0.7);
            --toast-bg: #2C3E6B;
            --toast-text: #fff;
            --border-light: rgba(255, 255, 255, 0.06);
            --primary: #5A7FC0;
            --primary-light: #6F92D0;
            --primary-dark: #3A5A8A;
        }

        [data-theme="dark"] .sidebar {
            background: #0E1525;
        }
        [data-theme="dark"] .sidebar-brand {
            border-bottom-color: rgba(255, 255, 255, 0.06);
        }
        [data-theme="dark"] .sidebar-footer {
            border-top-color: rgba(255, 255, 255, 0.06);
        }
        [data-theme="dark"] .topbar {
            background: var(--card);
            border-bottom-color: var(--border);
        }
        [data-theme="dark"] input,
        [data-theme="dark"] select {
            background: var(--input-bg);
            color: var(--text);
            border-color: var(--border);
        }
        [data-theme="dark"] input:focus,
        [data-theme="dark"] select:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.25);
        }
        [data-theme="dark"] .card {
            border-color: var(--border);
        }
        [data-theme="dark"] .company-chip {
            background: var(--card);
            border-color: var(--border);
        }
        [data-theme="dark"] .company-chip:hover {
            border-color: var(--secondary);
        }
        [data-theme="dark"] .sidebar-toggle {
            background: var(--primary);
            color: #fff;
        }
        [data-theme="dark"] .sidebar-toggle:hover {
            background: var(--primary-light);
        }
        [data-theme="dark"] .toast-msg {
            background: var(--toast-bg);
            color: var(--toast-text);
        }
        [data-theme="dark"] .card-header h3 {
            color: var(--text);
        }
        [data-theme="dark"] .card-header h3 i {
            color: var(--accent);
        }
        [data-theme="dark"] .page-title h2 {
            color: var(--text);
        }
        [data-theme="dark"] .page-title h2 i {
            color: var(--accent);
        }
        [data-theme="dark"] .welcome-text {
            color: var(--text);
        }
        [data-theme="dark"] .welcome-text span {
            color: var(--secondary);
        }
        [data-theme="dark"] .topbar .topbar-actions .lang-toggle {
            background: var(--bg);
            border-color: var(--border);
        }
        [data-theme="dark"] .topbar .topbar-actions .lang-toggle button {
            color: var(--text-light);
        }
        [data-theme="dark"] .topbar .topbar-actions .lang-toggle button.active {
            background: var(--primary);
            color: #fff;
        }
        [data-theme="dark"] .topbar .topbar-actions .lang-toggle button:hover:not(.active) {
            color: var(--text);
        }
        [data-theme="dark"] .sidebar-nav a {
            color: rgba(255, 255, 255, 0.6);
        }
        [data-theme="dark"] .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        [data-theme="dark"] .sidebar-nav a.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        [data-theme="dark"] .empty-state {
            color: var(--text-light);
        }
        [data-theme="dark"] .empty-state h4 {
            color: var(--text);
        }
        [data-theme="dark"] .text-muted {
            color: var(--text-light);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            transition: background 0.3s, color 0.3s;
        }
        a {
            color: var(--secondary);
            text-decoration: none;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
            border: none;
            background: none;
            outline: none;
        }
        input,
        select {
            font-family: inherit;
            font-size: inherit;
            outline: none;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            background: var(--input-bg);
            width: 100%;
            transition: var(--transition);
            color: var(--text);
        }
        input:focus,
        select:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.2);
        }
        input::placeholder {
            color: var(--text-light);
            opacity: 0.7;
        }
        select {
            appearance: auto;
            cursor: pointer;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--primary);
            color: #fff;
            height: 100vh;
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
            z-index: 100;
            transition: background 0.3s;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
        }
        .sidebar-brand {
            padding: 20px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .sidebar-brand i {
            font-size: 26px;
            color: var(--accent);
        }
        .sidebar-brand span {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .sidebar-brand small {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.7;
            display: block;
            margin-top: -2px;
        }
        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 11px 16px;
            border-radius: var(--radius-sm);
            color: rgba(255, 255, 255, 0.7);
            transition: var(--transition);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        .sidebar-nav a i {
            width: 20px;
            font-size: 16px;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .sidebar-nav a.active {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .sidebar-nav a.active i {
            color: var(--accent);
        }
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }
        .sidebar-footer .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.8);
        }
        .sidebar-footer .user-card .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: var(--primary);
            flex-shrink: 0;
            overflow: hidden;
        }
        .sidebar-footer .user-card .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sidebar-footer .user-card .user-info {
            flex: 1;
            min-width: 0;
        }
        .sidebar-footer .user-card .user-info .name {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-footer .user-card .user-info .role {
            font-size: 11px;
            opacity: 0.6;
        }
        .sidebar-footer .logout-btn {
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            background: none;
            border: none;
            cursor: pointer;
        }
        .sidebar-footer .logout-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 200;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: var(--transition);
        }
        .sidebar-toggle:hover {
            background: var(--primary-light);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 99;
            backdrop-filter: blur(2px);
        }

        .main-content {
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .topbar {
            background: var(--card);
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: background 0.3s, border-color 0.3s;
        }
        .topbar .page-title h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            transition: color 0.3s;
        }
        .topbar .page-title h2 i {
            color: var(--accent);
            margin-right: 8px;
        }
        .topbar .topbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .topbar .topbar-actions .lang-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg);
            padding: 4px 6px;
            border-radius: 30px;
            border: 1px solid var(--border);
            transition: background 0.3s, border-color 0.3s;
        }
        .topbar .topbar-actions .lang-toggle button {
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
            transition: var(--transition);
            border: none;
            background: none;
            color: var(--text-light);
            cursor: pointer;
        }
        .topbar .topbar-actions .lang-toggle button.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(27, 42, 74, 0.2);
        }
        .topbar .topbar-actions .lang-toggle button:hover:not(.active) {
            color: var(--primary);
        }
        .topbar .topbar-actions .theme-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            font-size: 13px;
            color: var(--text-light);
            font-weight: 600;
        }
        .topbar .topbar-actions .theme-toggle:hover {
            border-color: var(--secondary);
        }
        .topbar .topbar-actions .theme-toggle i {
            font-size: 16px;
            transition: color 0.3s;
        }
        .topbar .topbar-actions .welcome-text {
            font-weight: 500;
            color: var(--text);
            font-size: 14px;
            transition: color 0.3s;
        }
        .topbar .topbar-actions .welcome-text span {
            color: var(--primary);
            font-weight: 700;
            transition: color 0.3s;
        }
        .content-area {
            flex: 1;
            padding: 24px 28px 40px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid var(--border-light);
            transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .card-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary);
            transition: color 0.3s;
        }
        .card-header h3 i {
            color: var(--accent);
            margin-right: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 13px;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(27, 42, 74, 0.2);
        }
        .btn-secondary {
            background: var(--secondary);
            color: #fff;
        }
        .btn-secondary:hover {
            background: #3A7BC8;
            transform: translateY(-1px);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: var(--danger-hover);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1.5px solid var(--border);
        }
        .btn-outline:hover {
            background: var(--bg);
            border-color: var(--primary);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }
        .btn-xs {
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 4px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .form-row .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-row .form-group label {
            font-weight: 600;
            font-size: 13px;
            color: var(--primary);
            transition: color 0.3s;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .company-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .company-grid .company-chip {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition);
        }
        .company-grid .company-chip:hover {
            border-color: var(--secondary);
            box-shadow: var(--shadow);
        }
        .company-grid .company-chip .name {
            font-weight: 600;
        }
        .company-grid .company-chip .actions {
            display: flex;
            gap: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        .empty-state i {
            font-size: 48px;
            opacity: 0.3;
            margin-bottom: 12px;
        }
        .empty-state h4 {
            font-size: 18px;
            color: var(--text);
            margin-bottom: 4px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--modal-bg);
            z-index: 300;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: var(--card);
            border-radius: var(--radius);
            max-width: 620px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px 36px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-box .modal-header h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }
        .modal-box .modal-header .close-btn {
            font-size: 24px;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            background: none;
            border: none;
            padding: 4px 8px;
        }
        .modal-box .modal-header .close-btn:hover {
            color: var(--danger);
            transform: rotate(90deg);
        }
        .modal-box .modal-body {
            padding: 4px 0;
        }

        .text-muted {
            color: var(--text-light);
        }
        .lang-urdu {
            font-family: 'Noto Nastaliq Urdu', 'Urdu Typesetting', 'Alvi Lahori', serif;
        }
        .lang-urdu .sidebar-nav a {
            font-family: 'Noto Nastaliq Urdu', 'Urdu Typesetting', 'Alvi Lahori', serif;
        }
        .lang-urdu .topbar .page-title h2 {
            font-family: 'Noto Nastaliq Urdu', 'Urdu Typesetting', 'Alvi Lahori', serif;
        }
        .lang-urdu .card-header h3 {
            font-family: 'Noto Nastaliq Urdu', 'Urdu Typesetting', 'Alvi Lahori', serif;
        }
        .lang-urdu .btn {
            font-family: 'Noto Nastaliq Urdu', 'Urdu Typesetting', 'Alvi Lahori', serif;
        }
        .lang-urdu input,
        .lang-urdu select,
        .lang-urdu label {
            font-family: 'Noto Nastaliq Urdu', 'Urdu Typesetting', 'Alvi Lahori', serif;
        }
        .lang-urdu .sidebar-brand span {
            font-family: 'Noto Nastaliq Urdu', 'Urdu Typesetting', 'Alvi Lahori', serif;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 14px 28px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            z-index: 500;
            max-width: 90%;
            text-align: center;
            animation: fadeIn 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 992px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                transform: translateX(-100%);
                height: 100vh;
                width: 280px;
                z-index: 150;
                box-shadow: 4px 0 30px rgba(0, 0, 0, 0.2);
                border-radius: 0;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay.active {
                display: block;
            }
            .sidebar-toggle {
                display: flex;
            }
            .topbar {
                padding: 12px 16px 12px 60px;
            }
            .content-area {
                padding: 16px;
            }
            .card {
                padding: 18px 16px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .company-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 480px) {
            .topbar {
                padding: 10px 12px 10px 52px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .topbar .topbar-actions {
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .topbar .page-title h2 {
                font-size: 15px;
            }
            .card {
                padding: 14px 12px;
            }
            .content-area {
                padding: 10px;
            }
            .modal-box {
                padding: 18px 14px;
            }
            .btn {
                padding: 7px 14px;
                font-size: 12px;
            }
            .company-grid {
                grid-template-columns: 1fr;
            }
            .form-actions {
                flex-direction: column;
            }
            .form-actions .btn {
                width: 100%;
                justify-content: center;
            }
            .topbar .topbar-actions .theme-toggle {
                padding: 4px 10px;
                font-size: 12px;
            }
            .topbar .topbar-actions .theme-toggle i {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar Toggle -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <i class="fas fa-bars"></i>
    </button>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-store-alt"></i>
            <div>
                <span>SMS</span>
                <small>Shop Management</small>
            </div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav">
            <a href="dashboard.html"><i class="fas fa-th-large"></i> <span data-key="nav_dashboard">Dashboard</span></a>
            <a href="items.html"><i class="fas fa-boxes"></i> <span data-key="nav_items">Items</span></a>
            <a href="company.html" class="active"><i class="fas fa-building"></i> <span data-key="nav_company">Company</span></a>
            <a href="admins.html" id="navAdmins"><i class="fas fa-users-cog"></i> <span data-key="nav_admins">Admins</span></a>
            <a href="profile.html"><i class="fas fa-user"></i> <span data-key="nav_profile">Profile</span></a>
            <a href="recent-activity.html"><i class="fas fa-clock"></i> <span data-key="nav_activity">Recent Activity</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-card">
                <div class="avatar" id="sidebarAvatar">H</div>
                <div class="user-info">
                    <div class="name" id="sidebarName">Head</div>
                    <div class="role" id="sidebarRole">Head Admin</div>
                </div>
                <button class="logout-btn" id="logoutBtn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">
        <header class="topbar">
            <div class="page-title">
                <h2 id="pageTitle"><i class="fas fa-building"></i> <span data-key="title_company">Company</span></h2>
            </div>
            <div class="topbar-actions">
                <div class="theme-toggle" id="themeToggle" title="Toggle Dark/Light mode">
                    <i class="fas fa-moon" id="themeIcon"></i>
                    <span id="themeLabel">Dark</span>
                </div>
                <div class="lang-toggle">
                    <button class="active" data-lang="en">EN</button>
                    <button data-lang="ur">UR</button>
                </div>
                <div class="welcome-text">Welcome, <span id="welcomeName">Head</span></div>
            </div>
        </header>

        <div class="content-area">

            <!-- Add Company -->
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-plus-circle"></i> <span data-key="add_company">Add Company</span></h3>
                </div>
                <form id="companyForm">
                    <input type="hidden" id="companyEditId" value="" />
                    <div class="form-row">
                        <div class="form-group">
                            <label for="companyName"><span data-key="company_name">Company Name</span> *</label>
                            <input type="text" id="companyName" placeholder="Enter company name" required />
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="companySubmitBtn"><i class="fas fa-save"></i> <span data-key="save_company">Save Company</span></button>
                        <button type="button" class="btn btn-outline" id="companyCancelBtn"><i class="fas fa-times"></i> <span data-key="cancel">Cancel</span></button>
                    </div>
                </form>
            </div>

            <!-- All Companies -->
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-building"></i> <span data-key="all_companies">All Companies</span></h3>
                </div>
                <div id="companiesListContainer">
                    <div class="empty-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <h4>Loading companies...</h4>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Modal</h3>
                <button class="close-btn" id="modalCloseBtn">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>

    <script>
        // ============================================================
        //  FIREBASE CONFIG - REPLACE WITH YOUR OWN
        // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyB0RN2WGrPNLOxFMzOEjEITwAejZrzhWvE",
    authDomain: "shop-m-system.firebaseapp.com",
    databaseURL: "https://shop-m-system-default-rtdb.firebaseio.com",
    projectId: "shop-m-system",
    storageBucket: "shop-m-system.firebasestorage.app",
    messagingSenderId: "1037445605212",
    appId: "1:1037445605212:web:b0420a71036fb525f30399",
    measurementId: "G-X0203129L3"
  };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        //  CHECK LOGIN
        // ============================================================
        if (localStorage.getItem('sms_logged_in') !== 'true') {
            window.location.href = 'index.html';
        }

        // ============================================================
        //  HELPERS
        // ============================================================
        function generateId() {
            return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        function hasPermission(permission) {
            const role = localStorage.getItem('sms_admin_role') || 'head';
            if (role === 'head') return true;
            const perms = JSON.parse(localStorage.getItem('sms_admin_permissions') || '{"all":true,"functions":[]}');
            if (perms.all) return true;
            return perms.functions && perms.functions.includes(permission);
        }

        // ============================================================
        //  FIREBASE DATA HELPERS
        // ============================================================
        async function getData() {
            try {
                const uid = localStorage.getItem('sms_firebase_uid') || 'anonymous';
                const docRef = db.collection('users').doc(uid).collection('data').doc('appData');
                const doc = await docRef.get();
                if (doc.exists) {
                    return doc.data();
                }
                return { items: [], companies: [], activities: [], admins: [] };
            } catch (error) {
                console.error('Error getting data:', error);
                return { items: [], companies: [], activities: [], admins: [] };
            }
        }

        async function saveData(data) {
            try {
                const uid = localStorage.getItem('sms_firebase_uid') || 'anonymous';
                const docRef = db.collection('users').doc(uid).collection('data').doc('appData');
                await docRef.set(data, { merge: true });
                return true;
            } catch (error) {
                console.error('Error saving data:', error);
                return false;
            }
        }

        async function addActivity(data, action, details) {
            const adminName = localStorage.getItem('sms_admin_name') || 'Head';
            const adminId = localStorage.getItem('sms_admin_id') || 'admin_head';
            if (!data.activities) data.activities = [];
            data.activities.unshift({
                id: generateId(),
                action: action,
                adminId: adminId,
                adminName: adminName,
                details: details,
                timestamp: new Date().toISOString()
            });
            if (data.activities.length > 500) data.activities = data.activities.slice(0, 500);
            await saveData(data);
        }

        // ============================================================
        //  TRANSLATIONS
        // ============================================================
        const TRANSLATIONS = {
            en: {
                nav_dashboard: 'Dashboard',
                nav_items: 'Items',
                nav_company: 'Company',
                nav_admins: 'Admins',
                nav_profile: 'Profile',
                nav_activity: 'Recent Activity',
                title_company: 'Company',
                add_company: 'Add Company',
                company_name: 'Company Name',
                save_company: 'Save Company',
                cancel: 'Cancel',
                all_companies: 'All Companies',
                edit: 'Edit',
                delete: 'Delete',
                no_companies: 'No companies added yet.',
                update: 'Update',
                role_head: 'Head Admin',
                role_sub: 'Sub Admin',
                dark_mode: 'Dark',
                light_mode: 'Light',
                confirm_delete_company: 'Are you sure you want to delete this company?',
            },
            ur: {
                nav_dashboard: 'ڈیش بورڈ',
                nav_items: 'اشیا',
                nav_company: 'کمپنی',
                nav_admins: 'منتظمین',
                nav_profile: 'پروفائل',
                nav_activity: 'حالیہ سرگرمیاں',
                title_company: 'کمپنی',
                add_company: 'کمپنی شامل کریں',
                company_name: 'کمپنی کا نام',
                save_company: 'کمپنی محفوظ کریں',
                cancel: 'منسوخ',
                all_companies: 'تمام کمپنیاں',
                edit: 'ترمیم',
                delete: 'حذف',
                no_companies: 'ابھی تک کوئی کمپنی شامل نہیں۔',
                update: 'اپ ڈیٹ',
                role_head: 'ہیڈ منتظم',
                role_sub: 'ذیلی منتظم',
                dark_mode: 'تاریک',
                light_mode: 'روشن',
                confirm_delete_company: 'کیا آپ واقعی اس کمپنی کو حذف کرنا چاہتے ہیں؟',
            }
        };

        let currentLang = 'en';

        function t(key) {
            return TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key] ? TRANSLATIONS[currentLang][key] : key;
        }

        // ============================================================
        //  RENDER COMPANIES
        // ============================================================
        async function renderCompanies() {
            const container = document.getElementById('companiesListContainer');
            try {
                const data = await getData();
                const companies = [...(data.companies || [])].sort((a, b) => a.name.localeCompare(b.name));

                if (companies.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-building"></i>
                            <h4>${t('no_companies')}</h4>
                        </div>
                    `;
                    return;
                }

                let html = '<div class="company-grid">';
                companies.forEach(c => {
                    html += `
                        <div class="company-chip">
                            <span class="name">${escapeHtml(c.name)}</span>
                            <div class="actions">
                                ${hasPermission('edit_company') ? `<button class="btn btn-secondary btn-xs edit-company-btn" data-id="${c.id}"><i class="fas fa-edit"></i></button>` : ''}
                                ${hasPermission('delete_company') ? `<button class="btn btn-danger btn-xs delete-company-btn" data-id="${c.id}"><i class="fas fa-trash"></i></button>` : ''}
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

                container.querySelectorAll('.edit-company-btn').forEach(btn => {
                    btn.addEventListener('click', () => editCompany(btn.dataset.id));
                });
                container.querySelectorAll('.delete-company-btn').forEach(btn => {
                    btn.addEventListener('click', () => deleteCompany(btn.dataset.id));
                });

            } catch (error) {
                console.error('Error rendering companies:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h4>Error loading companies</h4>
                        <p>Please check your connection.</p>
                    </div>
                `;
            }
        }

        // ============================================================
        //  COMPANY CRUD
        // ============================================================
        document.getElementById('companyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = await getData();
            const id = document.getElementById('companyEditId').value;
            const name = document.getElementById('companyName').value.trim();

            if (!name) { alert('Company name is required.'); return; }

            if (!data.companies) data.companies = [];
            const adminId = localStorage.getItem('sms_admin_id') || 'admin_head';

            if (id) {
                if (!hasPermission('edit_company')) {
                    alert('You do not have permission to edit companies.');
                    return;
                }
                const existing = data.companies.find(c => c.id === id);
                if (!existing) { alert('Company not found.'); return; }
                existing.name = name;
                await saveData(data);
                resetCompanyForm();
                await renderCompanies();
                showToast('Company updated successfully!');
            } else {
                if (!hasPermission('add_company')) {
                    alert('You do not have permission to add companies.');
                    return;
                }
                const newCompany = {
                    id: generateId(),
                    name,
                    createdBy: adminId,
                    createdAt: new Date().toISOString()
                };
                data.companies.push(newCompany);
                await addActivity(data, 'add_company', `added company: ${name}`);
                await saveData(data);
                resetCompanyForm();
                await renderCompanies();
                showToast('Company added successfully!');
            }
        });

        function editCompany(id) {
            // We need to get data from cache or fetch again
            getData().then(data => {
                const company = data.companies.find(c => c.id === id);
                if (!company) return;
                if (!hasPermission('edit_company')) {
                    alert('You do not have permission to edit companies.');
                    return;
                }
                document.getElementById('companyEditId').value = id;
                document.getElementById('companyName').value = company.name;
                document.getElementById('companySubmitBtn').innerHTML = `<i class="fas fa-sync-alt"></i> ${t('update')}`;
                document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });
            });
        }

        async function deleteCompany(id) {
            const data = await getData();
            const company = data.companies.find(c => c.id === id);
            if (!company) return;
            if (!hasPermission('delete_company')) {
                alert('You do not have permission to delete companies.');
                return;
            }
            if (!confirm(t('confirm_delete_company') + `\n"${company.name}"`)) return;
            data.companies = data.companies.filter(c => c.id !== id);
            await addActivity(data, 'delete_company', `deleted company: ${company.name}`);
            await saveData(data);
            await renderCompanies();
            showToast('Company deleted successfully!');
        }

        function resetCompanyForm() {
            document.getElementById('companyEditId').value = '';
            document.getElementById('companyName').value = '';
            document.getElementById('companySubmitBtn').innerHTML = `<i class="fas fa-save"></i> ${t('save_company')}`;
        }

        document.getElementById('companyCancelBtn').addEventListener('click', resetCompanyForm);

        // ============================================================
        //  THEME
        // ============================================================
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeIcon').className = 'fas fa-sun';
                document.getElementById('themeLabel').textContent = t('light_mode') || 'Light';
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('themeIcon').className = 'fas fa-moon';
                document.getElementById('themeLabel').textContent = t('dark_mode') || 'Dark';
            }
            localStorage.setItem('sms_theme', theme);
        }

        function toggleTheme() {
            const current = localStorage.getItem('sms_theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // ============================================================
        //  LANGUAGE
        // ============================================================
        function setLanguage(lang) {
            currentLang = lang;
            document.body.classList.toggle('lang-urdu', lang === 'ur');
            document.querySelectorAll('.lang-toggle button').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === lang);
            });
            applyLanguage();
        }

        function applyLanguage() {
            const keys = ['nav_dashboard', 'nav_items', 'nav_company', 'nav_admins', 'nav_profile', 'nav_activity'];
            keys.forEach(k => {
                const el = document.querySelector(`[data-key="${k}"]`);
                if (el) el.textContent = t(k);
            });
            document.querySelector('[data-key="title_company"]').textContent = t('title_company');
            document.querySelector('[data-key="add_company"]').textContent = t('add_company');
            document.querySelector('[data-key="company_name"]').textContent = t('company_name');
            document.querySelector('[data-key="save_company"]').textContent = t('save_company');
            document.querySelector('[data-key="cancel"]').textContent = t('cancel');
            document.querySelector('[data-key="all_companies"]').textContent = t('all_companies');

            const theme = localStorage.getItem('sms_theme') || 'light';
            if (theme === 'dark') {
                document.getElementById('themeLabel').textContent = t('light_mode') || 'Light';
            } else {
                document.getElementById('themeLabel').textContent = t('dark_mode') || 'Dark';
            }

            renderCompanies();
        }

        document.querySelectorAll('.lang-toggle button').forEach(btn => {
            btn.addEventListener('click', function() {
                setLanguage(this.dataset.lang);
            });
        });

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(msg) {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = 'toast-msg';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transition = 'opacity 0.4s';
                setTimeout(() => div.remove(), 400);
            }, 3000);
        }

        // ============================================================
        //  SIDEBAR
        // ============================================================
        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        document.getElementById('sidebarToggle').addEventListener('click', openSidebar);
        document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

        window.addEventListener('resize', function() {
            if (window.innerWidth > 992) closeSidebar();
        });

        // ============================================================
        //  MODAL
        // ============================================================
        function openModal(title, bodyHtml) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHtml;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============================================================
        //  LOGOUT
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            try {
                await auth.signOut();
            } catch (e) { console.warn('Sign out error:', e); }
            localStorage.removeItem('sms_logged_in');
            localStorage.removeItem('sms_admin_name');
            localStorage.removeItem('sms_admin_role');
            localStorage.removeItem('sms_admin_id');
            localStorage.removeItem('sms_admin_permissions');
            localStorage.removeItem('sms_firebase_uid');
            window.location.href = 'index.html';
        });

        // ============================================================
        //  INIT
        // ============================================================
        const savedTheme = localStorage.getItem('sms_theme') || 'light';
        applyTheme(savedTheme);

        const adminName = localStorage.getItem('sms_admin_name') || 'Head';
        const adminRole = localStorage.getItem('sms_admin_role') || 'head';
        document.getElementById('sidebarAvatar').textContent = adminName.charAt(0).toUpperCase();
        document.getElementById('sidebarName').textContent = adminName;
        document.getElementById('sidebarRole').textContent = adminRole === 'head' ? t('role_head') : t('role_sub');
        document.getElementById('welcomeName').textContent = adminName;

        if (adminRole !== 'head') {
            document.getElementById('navAdmins').style.display = 'none';
        }

        renderCompanies();

        console.log('🏢 Company page loaded with Firebase integration.');
        console.log('👤 Logged in as:', adminName);
        console.log('📌 Make sure to replace firebaseConfig with your own credentials.');
    </script>

</body>
</html>
